# ---
# - name: Update packages on Ubuntu hosts
#   hosts: all
#   gather_facts: false

#   tasks:
#     - name: Update package cache
#       apt:
#         update_cache: yes

#     - name: Upgrade packages
#       apt:
#         upgrade: dist
#         autoremove: yes
#         autoclean: yes
# Run apt-get update and apt-get upgrade 
# Depends on: none
#   
# https://www.jeffgeerling.com/blog/2022/ansible-playbook-upgrade-ubuntudebian-servers-and-reboot-if-needed
--- 
- hosts: all
  gather_facts: yes
  become: yes

  tasks:
    - name: Ensure DNS search domain is set to hh10.lan
      ansible.builtin.lineinfile:
        path: /etc/resolv.conf
        line: "search hh10.lan"
        insertbefore: BOF
        state: present

    - name: Clean APT cache and partial files first
      ansible.builtin.command:
        cmd: "{{ item }}"
      loop:
        - apt-get clean
        - rm -rf /var/lib/apt/lists/partial /var/lib/apt/lists/*
      changed_when: true
      when: ansible_os_family == "Debian"

    - name: Vacuum systemd journal older than 30 days
      ansible.builtin.command: journalctl --vacuum-time=30d
      register: journal_vacuum
      changed_when: "'Vacuuming done' in journal_vacuum.stdout"
      when: ansible_service_mgr == "systemd"

    - name: Find rotated/compressed log files older than 30 days
      ansible.builtin.find:
        paths: /var/log
        recurse: yes
        age: 30d
        patterns:
          - '*.gz'
          - '*.old'
          - '*.[0-9]'
      register: old_log_files

    - name: Remove rotated/compressed log files older than 30 days
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_log_files.files }}"

    - name: Find temp files older than 30 days
      ansible.builtin.find:
        paths:
          - /tmp
          - /var/tmp
        age: 30d
        recurse: yes
        file_type: file
      register: old_tmp_files

    - name: Remove temp files older than 30 days
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_tmp_files.files }}"
      ignore_errors: yes

    # Only unused IMAGES older than 30 days. Never `docker system prune` / `container prune`: that deletes
    # every STOPPED container, including stacks that did not restart after the reboot below
    # (2026-11-16 Prometheus on docker-loki was lost that way, see wiki Incident-2026-11-16-Prometheus-container-lost).
    # Images still referenced by any container (running or stopped) are kept; volumes are never touched.
    - name: Docker prune unused images older than 30 days (containers and volumes are kept)
      ansible.builtin.command: docker image prune -a -f --filter "until=720h"
      register: docker_image_prune
      changed_when: "'Total reclaimed space: 0B' not in docker_image_prune.stdout"
      failed_when: false

    # - name: Set system hostname and domain
    #   ansible.builtin.hostname:
    #     # ansible_hostname is the current name on the machine
    #     name: "{{ ansible_hostname }}.hh10.lan"

    # - name: Update /etc/hosts with new domain
    #   ansible.builtin.lineinfile:
    #     path: /etc/hosts
    #     regexp: "^127\\.0\\.1\\.1"
    #     line: "127.0.1.1 {{ ansible_hostname }}.hh10.lan {{ ansible_hostname }}"
    #     state: present
        
    - name: Perform a dist-upgrade.
      ansible.builtin.apt:
        upgrade: dist
        update_cache: yes

    - name: Check if a reboot is required.
      ansible.builtin.stat:
        path: /var/run/reboot-required
        get_checksum: no
      register: reboot_required_file

    - name: Reboot the server (if required).
      ansible.builtin.reboot:
      when: reboot_required_file.stat.exists == true

    - name: Remove dependencies that are no longer required.
      ansible.builtin.apt:
        autoremove: yes
        autoclean: yes
